<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; color: #0f172a;
      font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 360px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #475569; font-size: 15px; line-height: 1.6; margin: 0 0 20px; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Campus LMS needs a connection to your school's server. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
